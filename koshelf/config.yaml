name: "KoShelf"
description: "A beautiful reading dashboard for your KOReader library with an integrated reader, statistics, and more."
version: "2026.10.0.1"
slug: "koshelf"
init: true
stage: experimental
backup: cold
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:bookshelf
panel_title: KoShelf
panel_admin: false
arch:
  - amd64
  - aarch64
  - armv7
  - i386
startup: services
timeout: 20
map:
  - media:rw
  - share:rw
ports:
  38492/tcp: 38492
ports_description:
  38492/tcp: Optional password-protected direct access; also configure direct_access
options:
  direct_access: auto
  allow_insecure_http: false
  direct_url: ""
  allowed_ha_user_ids: []
  title: ""
  include_unread: true
  include_all_stats: false
  library_path: []

  database_path: ""
  statistics_db: []
  kobo_db: ""
  docsettings_path: ""
  hashdocsettings_path: ""
  document_metadata_folder: doc
  archive_enabled: true
  archive_retention_days: "30"
  heatmap_scale_max: "auto"
  day_start_time: ""
  timezone: ""
  min_pages_per_day: ""
  min_time_per_day: "30s"
  language: "en_US"
  enable_auth: false
  reset_password: false
  trusted_proxies: []
  enable_writeback: false
  enable_library_management: false
  ignore_stable_page_metadata: false
  debug_log: false
schema:
  direct_access: list(auto|enabled|disabled)
  allow_insecure_http: bool
  direct_url: str?
  allowed_ha_user_ids:
    - str
  title: str?
  library_path:
    - str

  database_path: str?
  statistics_db:
    - str
  kobo_db: str?
  docsettings_path: str?
  hashdocsettings_path: str?
  document_metadata_folder: list(doc|dir|hash)
  archive_enabled: bool
  archive_retention_days: str
  include_unread: bool
  include_all_stats: bool
  heatmap_scale_max: str?
  day_start_time: str?
  timezone: str?
  min_pages_per_day: str?
  min_time_per_day: str?
  language: str?
  enable_auth: bool
  reset_password: bool
  trusted_proxies:
    - str
  enable_writeback: bool
  enable_library_management: bool
  ignore_stable_page_metadata: bool
  debug_log: bool
